# `cli` is the `mdnotate` command, a separate crate rather than a second
# `[[bin]]` here: sharing this package would link it against `mdnotate_lib` and
# so against tauri, sqlx and the rest, for a program whose whole job is to call
# `open` once. `default-members` keeps it out of a bare `cargo build`, which is
# what `tauri dev` and `tauri build` run — the command is built on its own, by
# `scripts/build-cli.sh`.
[workspace]
members = [".", "cli"]
default-members = ["."]

[package]
name = "mdnotate"
version = "0.7.0"
description = "Markdown Annotate - read and annotate local Markdown files"
authors = ["reorx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdnotate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }

# LaunchServices FFI for the "default Markdown app" status
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"

