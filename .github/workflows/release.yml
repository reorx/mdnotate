name: release

# push v* tag → 构建 universal dmg（Developer ID 签名 + 公证 + staple）→ 发布到本仓库 Release
# workflow_dispatch 手动触发 → 只构建签名并上传 artifact，不发 release（验证链路用）。
#
# 与 vocalflow-mac 的 xcodebuild 链路不同：Tauri CLI 检测到 APPLE_CERTIFICATE /
# APPLE_API_KEY 等环境变量后，自动完成临时 keychain 导入、codesign（hardened
# runtime + timestamp）、notarytool 公证、staple，无需手写 security / notarytool。
#
# 所需 secrets（命名沿用 vocalflow-mac，值为同一套 Developer ID 凭据）：
#   MACOS_CERT_P12       Developer ID Application 证书 p12 的 base64
#   MACOS_CERT_PASSWORD  p12 密码
#   NOTARY_KEY           App Store Connect API key p8 的 base64
#   NOTARY_KEY_ID        API Key ID
#   NOTARY_ISSUER_ID     API Issuer ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release-build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # tag 与 tauri.conf.json 版本不一致时快速失败，避免发出版本号错误的产物
      - name: Check tag matches tauri.conf.json version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME 与 tauri.conf.json version $VERSION 不一致" >&2
            exit 1
          fi

      - name: Add Rust targets for universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
        run: |
          echo "${{ secrets.NOTARY_KEY }}" | base64 -d > "$APPLE_API_KEY_PATH"
          pnpm tauri build --target universal-apple-darwin
          rm "$APPLE_API_KEY_PATH"

      # 发布前自查：Developer ID 签名、hardened runtime、时间戳、Gatekeeper 评估
      - name: Verify signature
        run: |
          APP=$(echo src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Developer ID|runtime|Timestamp"
          spctl -a -vv -t exec "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: mdnotate-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          gh release create "$GITHUB_REF_NAME" "${DMG[@]}" \
            --title "mdnotate $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "${DMG[@]}" --clobber
